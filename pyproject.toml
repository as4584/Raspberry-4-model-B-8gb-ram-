[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-local-receptionist"
version = "0.1.0"
description = "Raspberry Pi 4 local AI receptionist: deterministic scheduling and Twilio audio transport"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["receptionist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
