[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-local-receptionist"
version = "0.1.0"
description = "Raspberry Pi 4 local AI receptionist: deterministic scheduling and Twilio audio transport"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pyyaml>=6,<7", "pytest-cov>=5,<8"]

[tool.setuptools.packages.find]
include = ["receptionist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
# Safety-critical core: booking transactions and the confirmation state machine.
source_paths = ["receptionist/booking.py", "receptionist/dialogue.py"]
also_copy = ["scripts/", ".github/", "docs/", ".env.example", ".gitignore"]
# Booking/dialogue tests only; the 8-process race is too slow to run per mutant
# (it still runs in the pytest job).
pytest_add_cli_args_test_selection = ["tests/test_booking.py", "tests/test_booking_safety.py", "tests/test_booking_edges.py", "tests/test_dialogue_contract.py", "tests/test_dialogue_s2.py", "-k", "not across_processes"]
