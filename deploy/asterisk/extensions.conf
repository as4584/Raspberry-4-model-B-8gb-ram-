; Calls from Telnyx and from local SIPp tests share one receptionist path.
[from-telnyx]
exten => _X.,1,Goto(receptionist,s,1)
exten => _+X.,1,Goto(receptionist,s,1)

[from-sipp]
exten => _X.,1,Goto(receptionist,s,1)

[receptionist]
exten => s,1,Answer()
 same => n,Dial(WebSocket/receptionist/c(ulaw)v(caller=${URIENCODE(${CALLERID(num)})}))
 same => n,Hangup()
