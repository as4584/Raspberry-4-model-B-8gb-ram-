[general]
static = yes
writeprotect = yes

; Owner-approved review numbers ([globals] REVIEW_<last 10 digits>=1), written by
; pi_install_asterisk.sh from REVIEW_CALLERS. Absent file -> nobody is recorded.
#tryinclude /etc/asterisk/review.conf

[from-telnyx]
; TLS: the telnyx endpoint has only transport-tls (the other transport is loopback-only).
; SRTP: media_encryption=sdes with no fallback, so Asterisk refuses unencrypted offers;
; checked again here once media is up (CHANNEL(rtp,secure) is empty before Answer).
exten => _X.,1,Answer()
 same => n,NoOp(Inbound call - srtp=${CHANNEL(rtp,secure)})
 same => n,GotoIf($["${CHANNEL(rtp,secure)}" = "1"]?ok)
 same => n,Log(WARNING,Rejecting inbound call without SRTP)
 same => n,Hangup(21)
 same => n(ok),Goto(receptionist,s,1)
exten => _+X.,1,Goto(from-telnyx,${EXTEN:1},1)
exten => s,1,Goto(from-telnyx,0000,1)

[from-sipp]
; Loopback SIPp tests (transport-test, 127.0.0.1:5070). 'echo' proves the media path.
exten => echo,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
exten => _X.,1,Goto(receptionist,s,1)
; 'rec<n>': record caller|receptionist as time-aligned interleaved stereo 8 kHz s16 raw
; (MixMonitor D) for the measurement harness. Test calls only; real callers never.
exten => _recX.,1,MixMonitor(/var/spool/asterisk/monitor/sipp-${CALLERID(num):1}.raw,D)
 same => n,Goto(receptionist,s,1)

[receptionist]
; The receptionist gets the caller number and this channel's id (for ARI transfers).
; 'g' continues here after the receptionist hangs up its leg. For a transfer it sets the
; per-call GLOBAL XFER_<uniqueid> via ARI (per-channel vars need Stasis: HTTP 409).
exten => s,1,Answer()
 same => n,GotoIf($["${GLOBAL(REVIEW_${CALLERID(num):-10})}" != "1"]?go)
 same => n,MixMonitor(/var/spool/asterisk/review/${STRFTIME(,,%Y%m%d-%H%M%S)}-${UNIQUEID}.raw,D)
 same => n(go),Dial(WebSocket/receptionist/c(ulaw)v(caller=${URIENCODE(${CALLERID(num)})},chan=${UNIQUEID}),,g)
 same => n,Set(TRANSFER_TO=${GLOBAL(XFER_${REPLACE(UNIQUEID,.,_)})})
 same => n,Set(GLOBAL(XFER_${REPLACE(UNIQUEID,.,_)})=)
 same => n,GotoIf($["${TRANSFER_TO}" != ""]?transfer)
 same => n,Hangup()
 same => n(transfer),Dial(PJSIP/${TRANSFER_TO}@telnyx,30)
 same => n,Hangup()
