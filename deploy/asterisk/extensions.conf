[general]
static = yes
writeprotect = yes

[from-telnyx]
; Reject the call unless BOTH signalling and media are encrypted (TLS + SRTP).
exten => _X.,1,NoOp(Inbound call; secure_signaling=${CHANNEL(secure_signaling)} secure_media=${CHANNEL(secure_media)})
 same => n,GotoIf($["${CHANNEL(secure_signaling)}${CHANNEL(secure_media)}" = "11"]?ok)
 same => n,Log(WARNING,Rejecting insecure inbound call)
 same => n,Hangup(21)
 same => n(ok),Goto(receptionist,s,1)
exten => _+X.,1,Goto(from-telnyx,${EXTEN:1},1)
exten => s,1,Goto(from-telnyx,0000,1)

[from-sipp]
; Loopback SIPp tests (transport-test, 127.0.0.1:5070). 'echo' proves the media path.
exten => echo,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
exten => _X.,1,Goto(receptionist,s,1)
; 'rec<n>': record both directions separately (measurement harness: latency, quality,
; barge-in). Test calls only; real callers are never recorded.
exten => _recX.,1,Set(REC=/var/spool/asterisk/monitor/sipp-${CALLERID(num):1})
 same => n,MixMonitor(${REC}-mix.wav,r(${REC}-caller.wav)t(${REC}-agent.wav))
 same => n,Goto(receptionist,s,1)

[receptionist]
; The receptionist gets the caller number and this channel's id (for ARI transfers).
; 'g' continues here after the receptionist hangs up its leg. For a transfer it sets the
; per-call GLOBAL XFER_<uniqueid> via ARI (per-channel vars need Stasis: HTTP 409).
exten => s,1,Answer()
 same => n,Dial(WebSocket/receptionist/c(ulaw)v(caller=${URIENCODE(${CALLERID(num)})},chan=${UNIQUEID}),,g)
 same => n,Set(TRANSFER_TO=${GLOBAL(XFER_${REPLACE(UNIQUEID,.,_)})})
 same => n,Set(GLOBAL(XFER_${REPLACE(UNIQUEID,.,_)})=)
 same => n,GotoIf($["${TRANSFER_TO}" != ""]?transfer)
 same => n,Hangup()
 same => n(transfer),Dial(PJSIP/${TRANSFER_TO}@telnyx,30)
 same => n,Hangup()
