; No secrets here. Telnyx credentials + registration live in a RAM-only include rendered
; from Doppler (/run/asterisk-secrets, tmpfs). Adapted from the owner's Telnyx kit.
[global]
type = global
user_agent = lexmakesit-receptionist
endpoint_identifier_order = ip,username,anonymous

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
method = tlsv1_2
ca_list_file = /etc/ssl/certs/ca-certificates.crt
verify_server = yes
verify_client = no
; Behind home NAT, if needed (router changes need owner approval):
;external_signaling_address = 203.0.113.10
;external_media_address = 203.0.113.10
;local_net = 192.168.0.0/16

; Loopback-only UDP transport, used exclusively by local SIPp tests.
[transport-test]
type = transport
protocol = udp
bind = 127.0.0.1:5070

[telnyx]
type = endpoint
transport = transport-tls
context = from-telnyx
disallow = all
allow = ulaw,alaw,g722
outbound_auth = telnyx-auth
aors = telnyx
from_domain = sip.telnyx.com
media_encryption = sdes
media_encryption_optimistic = no
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[telnyx]
type = aor
contact = sip:sip.telnyx.com:5061\;transport=tls
qualify_frequency = 60

[telnyx]
type = identify
endpoint = telnyx
match = sip.telnyx.com

; Local SIPp test caller (loopback only; plain RTP is fine on 127.0.0.1).
[sipp]
type = endpoint
transport = transport-test
context = from-sipp
disallow = all
allow = ulaw
direct_media = no

[sipp]
type = identify
endpoint = sipp
match = 127.0.0.1

#tryinclude /run/asterisk-secrets/pjsip-secrets.conf
